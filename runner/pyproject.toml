[project]
name = "agentforge-runner"
version = "0.1.0"
description = "AgentForge Runner: ejecución aislada de programas permitidos con Podman rootless (protocolo v1, ADR 0007)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.18",
]

[project.scripts]
agentforge-runner = "agentforge_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_runner"]
