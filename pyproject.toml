[project]
name = "agentforge"
version = "0.2.0"
description = "Fase 2: FastAPI + LangGraph + Claude (Vertex AI) + orquestador robusto + aprobación humana"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "pydantic-settings>=2.0",
    "anthropic[vertex]>=2.3.0",
]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
