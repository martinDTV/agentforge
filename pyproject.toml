[project]
name = "agentforge"
version = "0.5.0"
description = "Fase 5: FastAPI + LangGraph + Claude (Vertex AI) + PostgreSQL + OIDC + Tool Gateway, worktrees Git y ejecución aislada con un runner Podman rootless"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "pydantic-settings>=2.0",
    "anthropic[vertex]>=2.3.0",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "pycryptodome>=3.20",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]
[dependency-groups]
# The runner is a separate deployable (runner/); it is installed here only so
# its unit tests run in the root suite. app/ never imports it.
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "agentforge-runner"]

[tool.uv.workspace]
members = ["runner"]

[tool.uv.sources]
agentforge-runner = { workspace = true }
[tool.pytest.ini_options]
pythonpath = ["."]
# Default run = unit suite only (no external services).
# Integration suite (needs PostgreSQL): uv run pytest tests/integration -q
testpaths = ["tests/unit"]
markers = [
    "integration: requiere PostgreSQL; se ejecuta explícitamente con tests/integration",
]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
